name: Build APK Release

# Hanya jalan manual: Actions, pilih "Build APK Release", lalu Run workflow.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Periksa data stage
        run: python3 tools/cek_stage.py

      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/garis-kata.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            STORE_PASS="$SECRET_STORE_PASSWORD"
            ALIAS="$SECRET_KEY_ALIAS"
            KEY_PASS="$SECRET_KEY_PASSWORD"
            echo "Memakai keystore dari secrets."
          else
            STORE_PASS="$(openssl rand -hex 16)"
            KEY_PASS="$STORE_PASS"
            ALIAS="garis-kata"
            keytool -genkeypair -keystore "$KEYSTORE" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Hanz Dev Official"
            echo "Secrets keystore kosong, membuat keystore baru untuk build ini."
          fi
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          {
            echo "KEYSTORE_PATH=$KEYSTORE"
            echo "KEYSTORE_PASSWORD=$STORE_PASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build APK release
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verifikasi tanda tangan APK
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: garis-kata-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
